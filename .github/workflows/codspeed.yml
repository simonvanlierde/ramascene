name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # lets CodSpeed trigger backtest runs to build initial history
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # The locked set, so the benchmarks measure the versions the images run.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        env:
          # OpenBLAS threads spin under the CPU simulation; see benchmarks/conftest.py
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        with:
          mode: simulation
          run: pytest benchmarks/ --codspeed
