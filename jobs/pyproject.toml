[project]
name = "ramascene-jobs"
version = "0.1.0"
description = "Thin job API around the RaMa-Scene engine: one scenario per job, one job at a time"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
authors = [{ name = "Simon van Lierde", email = "simonvanlierde@gmail.com" }]
dependencies = [
  "fastapi>=0.141",
  "opentelemetry-exporter-otlp-proto-http>=1.45",
  "opentelemetry-instrumentation-fastapi>=0.66b0",
  "opentelemetry-sdk>=1.45",
  "pydantic>=2.12",
  "ramascene",
  "uvicorn>=0.54",
]
[project.scripts]
ramascene-jobs = "ramascene_jobs.__main__:main"

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.16",
  "ty>=0.0.63",
  "httpx>=0.28", # fastapi.testclient
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ramascene_jobs"

# The engine is an editable path install, which ty does not follow.
[tool.ty.environment]
extra-paths = [".."]

[tool.uv.sources]
ramascene = { path = "..", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN204", # missing-return-type-special-method
  "COM812", # trailing-comma-missing: conflicts with the formatter
  "CPY001", # missing copyright notice
  "D105",   # undocumented-magic-method
  "D107",   # undocumented-public-init
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001"]              # tests are not a package
"test*.py" = ["S101", "PLR2004"]     # allow assert and literals in tests

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int"]
max-args = 10

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib", "-m", "not engine"]
markers = ["engine: runs the real engine on the EXIOBASE dataset (~1.65 GB per job); `pytest -m engine`"]
testpaths = ["tests"]
# Starlette 1.x warns that its TestClient prefers httpx2.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

